<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackathon Project — Frontend Starter</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h1 { margin-top: 0; font-size: 1.4rem; color: #38bdf8; }
    p { color: #94a3b8; line-height: 1.5; font-size: 0.95rem; }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.65rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover { background: #0284c7; color: #fff; }
    pre {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      overflow-x: auto;
      color: #a7f3d0;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Hackathon Frontend Placeholder</h1>
    <p>
      Ye sirf ek starter HTML file hai. Jab frontend stack decide ho jaye (React / Next.js / Vite / Vanilla JS), tab is folder ko update kar lena.
    </p>
    <button onclick="checkBackend()">Test FastAPI Backend Connection</button>
    <pre id="output"></pre>
  </div>

  <script>
    async function checkBackend() {
      const out = document.getElementById("output");
      out.style.display = "block";
      out.textContent = "Pinging http://localhost:8000/api/health ...";
      try {
        const res = await fetch("http://localhost:8000/api/health");
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = "Backend not reachable yet. Run `uv run python run.py` inside /backend first!\n\n" + err;
      }
    }
  </script>
</body>
</html>
