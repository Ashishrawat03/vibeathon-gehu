[project]
name = "hackathon-ai-backend"
version = "0.1.0"
description = "FastAPI AI Hackathon Boilerplate managed with uv (Groq + Gemini + HuggingFace Embeddings + Supabase)"
readme = "BACKEND.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "groq>=0.11.0",
    "google-genai>=0.3.0",
    "huggingface-hub>=0.26.0",
    "supabase>=2.10.0",
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
